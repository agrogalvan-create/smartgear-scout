name: Validate website links
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local HTML links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import unquote
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      href=dict(attrs).get('href')
                      if href: self.links.append(href)
          errors=[]
          pages=list(Path('.').rglob('*.html'))
          for page in pages:
              p=Links();p.feed(page.read_text(encoding='utf-8'))
              for link in p.links:
                  if link.startswith(('http:','https:','mailto:','#','tel:')): continue
                  dest=page.parent / unquote(link.split('#')[0].split('?')[0])
                  if not dest.exists(): errors.append(f'{page}: broken link {link}')
          print(f'Checked {len(pages)} HTML pages')
          if errors: raise SystemExit('\n'.join(errors))
          PY
