name: Validate site links
on:
  push:
    paths:
      - '**/*.html'
      - 'scripts/check_site_links.py'
      - '.github/workflows/check-site-links.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/check_site_links.py'
      - '.github/workflows/check-site-links.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site_links.py
