name: Monitor production website
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
jobs:
  smoke-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published sitemap, robots and canonical URLs
        run: python scripts/check_production.py
