name: Validate product catalog
on:
  push:
    paths:
      - 'data/products.csv'
      - 'scripts/validate_products.py'
      - '.github/workflows/validate-catalog.yml'
  pull_request:
    paths:
      - 'data/products.csv'
      - 'scripts/validate_products.py'
      - '.github/workflows/validate-catalog.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog evidence
        run: python scripts/validate_products.py
