name: Verify deployable static site
on:
  push:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'scripts/build_site.py'
      - 'scripts/generate_sitemap.py'
      - 'tests/test_public_build.py'
      - 'scripts/check_site_links.py'
      - '.github/workflows/verify-site-build.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'scripts/build_site.py'
      - 'scripts/check_site_links.py'
      - '.github/workflows/verify-site-build.yml'
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source HTML links
        run: python scripts/check_site_links.py
      - name: Build public site
        run: python scripts/build_site.py
      - name: Generate and parse test sitemap
        env:
          SITE_URL: https://example.com/smartgear-scout
        run: |
          python scripts/build_site.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml')"
          grep -q 'Sitemap: https://example.com/smartgear-scout/sitemap.xml' dist/robots.txt
      - name: End-to-end public build tests
        run: python -m unittest discover -s tests -p 'test_public_build.py' -v
      - name: Audit deployable HTML links
        run: python scripts/check_site_links.py dist
      - name: Check output
        run: |
          test -f dist/index.html
          test -f dist/about.html
          test -f dist/disclosure.html
          test ! -e dist/research
          test ! -e dist/scripts
          test ! -e dist/.github
